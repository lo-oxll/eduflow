[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=core
    --cov=services
    --cov=server
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --maxfail=5
    --tb=short

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests that require database
    api: marks API endpoint tests
    auth: marks authentication and authorization tests
    security: marks security-related tests (XSS, SQL injection, password)
    validation: marks data validation tests
    smoke: marks smoke tests for quick verification

# Configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
